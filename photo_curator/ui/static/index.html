<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Curator — Review</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◫</span>
      <div>
        <h1>Photo Curator</h1>
        <div class="sub">Review &amp; approve curation plan</div>
      </div>
    </div>
    <div class="topstats" id="topstats"></div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="categories">Categories</button>
    <button class="tab" data-tab="bursts">Bursts</button>
    <button class="tab" data-tab="junk">Junk Review</button>
    <button class="tab" data-tab="uncertain">Uncertain</button>
    <button class="tab" data-tab="actions">Actions</button>
  </nav>

  <main>
    <!-- CATEGORIES -->
    <section id="tab-categories" class="panel active">
      <div class="toolbar">
        <input id="q" type="search" placeholder="Search filename or path…">
        <select id="catfilter"><option value="">All categories</option></select>
        <label class="chk"><input type="checkbox" id="manualonly"> Manual overrides only</label>
        <span id="rowcount" class="muted"></span>
      </div>
      <div id="grid" class="grid"></div>
    </section>

    <!-- BURSTS -->
    <section id="tab-bursts" class="panel">
      <div id="burstlist" class="burstlist"></div>
      <div id="burstdetail" class="burstdetail"></div>
    </section>

    <!-- JUNK / UNCERTAIN reuse the grid with a category filter -->
    <section id="tab-junk" class="panel">
      <div class="toolbar">
        <select id="junkfilter">
          <option value="">All junk</option>
          <option value="duplicate">Duplicates</option>
          <option value="screenshot">Screenshots</option>
          <option value="document">Documents</option>
          <option value="graphic">Graphics</option>
          <option value="accidental">Accidental</option>
        </select>
        <span id="junkcount" class="muted"></span>
      </div>
      <div id="junkgrid" class="grid"></div>
    </section>

    <section id="tab-uncertain" class="panel">
      <div id="uncertaingrid" class="grid"></div>
    </section>

    <!-- ACTIONS -->
    <section id="tab-actions" class="panel">
      <div class="actionbar">
        <div class="field">
          <label>Operation</label>
          <select id="op">
            <option value="move">Move</option>
            <option value="copy">Copy</option>
            <option value="hardlink">Hardlink (in-place)</option>
            <option value="symlink">Symlink (in-place)</option>
          </select>
        </div>
        <div class="field">
          <label>Mode</label>
          <select id="orgmode">
            <option value="category_first">Category-first (Option 1)</option>
            <option value="in_place">In-place links (Option 2)</option>
          </select>
        </div>
        <div class="field grow">
          <label>Organize root</label>
          <input id="orgroot" value="Organized">
        </div>
        <button id="btn-rebuild" class="btn">Rebuild plan (dry-run)</button>
        <button id="btn-apply" class="btn primary">Apply plan</button>
      </div>
      <div id="plan-summary" class="plan-summary muted">No plan built yet.</div>

      <div class="txnbar">
        <label>Transaction</label>
        <select id="txnselect"><option value="">Latest</option></select>
        <button id="btn-undo" class="btn danger">Undo transaction</button>
      </div>
      <div id="action-log" class="action-log"></div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
