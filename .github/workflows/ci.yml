name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[watch]" pytest httpx ruff
      - name: Lint (syntax errors and undefined names)
        run: ruff check photocure tests --select E9,F63,F7,F82
      - name: No InsightFace in code or at import time
        run: |
          python -c "import sys, photocure; assert 'insightface' not in sys.modules"
          ! git grep -iq "insightface" -- . ':!tests' ':!CHANGELOG*' ':!implementation_plan.md' ':!NOTICE' ':!docs' ':!.github/workflows/ci.yml'
      - name: Tests (the browser tests use the Chrome that ships on the runner)
        run: pytest -q
      - name: Virtual grid tests
        run: node tests/virtual_grid.test.mjs

  faces:
    name: Blink detection with MediaPipe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries for MediaPipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install with the faces extra, then put the headless OpenCV back
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[faces]" pytest httpx
          pip uninstall -y opencv-contrib-python opencv-python
          pip install --force-reinstall --no-deps opencv-python-headless
      - name: Face tests with the real landmarker
        run: pytest -v tests/test_c3_faces.py tests/test_bench_c3.py

  packaging:
    name: Debian packaging and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils imagemagick
          python -m pip install --upgrade pip
      - name: Build wheel and .deb package
        run: |
          bash packaging/deb/build_deb.sh
      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net packaging/deb/photocure.metainfo.xml
      - name: Validate desktop file
        run: desktop-file-validate packaging/deb/photocure.desktop
      - name: Check .deb package contents
        run: |
          deb_file=$(ls dist/photocure_*_amd64.deb | head -1)
          dpkg -c "$deb_file" | head -20
          dpkg -c "$deb_file" | grep -q "usr/lib/systemd/user/photocure.service" || exit 1
          dpkg -c "$deb_file" | grep -q "usr/share/metainfo/io.github.safiyu.photocure.metainfo.xml" || exit 1
      - name: Smoke test - install in isolated container
        run: |
          docker run --rm -v "$(pwd)/dist:/dist" ubuntu:24.04 bash -c "
            set -e
            apt-get update
            apt-get install -y --no-install-recommends /dist/photocure_*_amd64.deb
            /usr/bin/photocure --version
            /usr/bin/photocure stop || true
          "
