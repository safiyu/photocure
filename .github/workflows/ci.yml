name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest httpx ruff
      - name: Lint (syntax errors and undefined names)
        run: ruff check photocure tests --select E9,F63,F7,F82
      - name: Tests
        run: pytest -q
      - name: Virtual grid tests
        run: |
          if [ -f tests/virtual_grid.test.mjs ]; then node tests/virtual_grid.test.mjs; else echo "virtual grid tests arrive with C4"; fi
