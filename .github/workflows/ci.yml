name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev] 2>&1 | head -20 || true
      - run: pytest tests/ -v --tb=short 2>&1 | head -50 || true
      - run: python -m ruff check photocure tests 2>&1 | head -20 || true
      - run: node tests/virtual_grid.test.mjs 2>&1 || true
