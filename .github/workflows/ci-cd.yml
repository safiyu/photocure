name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest httpx

      - name: Run tests
        run: |
          pytest -q tests/test_setup.py tests/test_cli.py tests/test_doctor.py tests/test_rename.py

  tag-and-release:
    name: Sync Version and Tag
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version and Create Tag
        id: tag_version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="v$VERSION"
          echo "new_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=$TAG" >> "$GITHUB_OUTPUT"

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"* %s (%h)" "$PREV_TAG..HEAD" 2>/dev/null || true)
          else
            LOG=$(git log -n 10 --pretty=format:"* %s (%h)")
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

  package-deb:
    name: Build & Release Debian Package
    needs: [test, tag-and-release]
    if: always() && needs.test.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_ver
        run: |
          if [ -n "${{ needs.tag-and-release.outputs.new_version }}" ]; then
            echo "version=${{ needs.tag-and-release.outputs.new_version }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ needs.tag-and-release.outputs.new_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debian Package
        run: |
          chmod +x packaging/deb/build_deb.sh
          ./packaging/deb/build_deb.sh "${{ steps.get_ver.outputs.version }}"

      - name: Generate Checksums & Release Notes
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS.txt
          TAG="${{ steps.get_ver.outputs.tag }}"
          cat << EOF > release_notes.md
          ### 📦 Download & Install (.deb)

          Download the package directly below or install via terminal:

          \`\`\`bash
          curl -LO https://github.com/safiyu/photocure/releases/download/${TAG}/photocure_amd64.deb
          sudo apt install ./photocure_amd64.deb
          photocure setup
          \`\`\`

          ---
          EOF
          if [ -n "${{ needs.tag-and-release.outputs.changelog }}" ]; then
            echo "" >> release_notes.md
            echo "### Changelog" >> release_notes.md
            echo "${{ needs.tag-and-release.outputs.changelog }}" >> release_notes.md
          fi

      - name: Upload Debian Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photocure-debian-package
          path: |
            dist/*.deb
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_ver.outputs.tag }}
          name: Release ${{ steps.get_ver.outputs.tag }}
          body_path: dist/release_notes.md
          files: |
            dist/*.deb
            dist/SHA256SUMS.txt

  docker-release:
    name: Build & Push Docker Image
    needs: [test, tag-and-release]
    if: always() && needs.test.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine Docker Tags
        id: docker_meta
        run: |
          VER="${{ needs.tag-and-release.outputs.new_version }}"
          TAG="${{ needs.tag-and-release.outputs.new_tag }}"
          if [ -n "$VER" ]; then
            echo "tags=safiyu/photocure:latest,safiyu/photocure:${TAG},safiyu/photocure:${VER}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=safiyu/photocure:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'safiyu' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
